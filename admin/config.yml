- name: "blog"
    label: "Blog y Técnicas"
    folder: "contenido/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título del Artículo", name: "title", widget: "string"}
      - {label: "Categoría o Técnica", name: "categoria", widget: "string", default: "Técnica Artesanal"}
      - {label: "Fecha", name: "date", widget: "date", format: "YYYY-MM-DD"}
      - {label: "Imagen de Portada", name: "imagen", widget: "image"}
      - {label: "Resumen Corto", name: "descripcion", widget: "text"}
      - {label: "Contenido Completo (Editor de Texto)", name: "body", widget: "markdown"}
      - {label: "Archivo Descargable (Patrón, Guía o PDF Opcional)", name: "archivo", widget: "file", required: false}
