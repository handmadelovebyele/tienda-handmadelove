backend:
  name: github
  repo: handmadelovebyele/tienda-handmadelove
  branch: main

media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "banners"
    label: "Banners y Promociones"
    folder: "contenido/banners"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Identificador (velas, bisuteria, bordado, pintura, crochet, blog)", name: "title", widget: "string" }
      - { label: "Título Principal del Banner (Dejar vacío si el arte ya tiene texto)", name: "titulo", widget: "string", required: false }
      - { label: "Mensaje / Descripción (Dejar vacío si el arte ya tiene texto)", name: "descripcion", widget: "text", required: false }
      - { label: "Imagen de Fondo", name: "imagen", widget: "image" }

  - name: "promociones"
    label: "Descuentos por Fechas (Por Categoría, Talleres o Tienda)"
    folder: "contenido/promociones"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nombre de la Campaña (ej: Pronto Pago Noviembre)", name: "title", widget: "string" }
      - { label: "Aplica a", name: "categoria", widget: "select", options: ["Todas", "Talleres", "Velas", "Bisutería", "Bordado", "Pintura", "Crochet"] }
      - { label: "Porcentaje de Descuento (%)", name: "descuento", widget: "number", value_type: "int", min: 0, max: 90, default: 10 }
      - { label: "Fecha de Inicio", name: "fechaInicio", widget: "datetime" }
      - { label: "Fecha de Fin", name: "fechaFin", widget: "datetime" }
      - { label: "Activa", name: "activa", widget: "boolean", default: true }

  - name: "productos"
    label: "Productos y Creaciones"
    folder: "contenido/productos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título de la Pieza", name: "title", widget: "string" }
      - { label: "Categoría Principal", name: "categoria", widget: "select", options: ["Velas", "Bisutería", "Bordado", "Pintura", "Crochet"] }
      - { label: "Subcategoría / Temporada (Opcional)", name: "subcategoria", widget: "string", required: false }
      - { label: "Precio Normal ($)", name: "precio", widget: "number", value_type: "float" }
      - { label: "Descuento Individual (%) (Opcional)", name: "descuento", widget: "number", value_type: "int", default: 0, required: false }
      - { label: "Inicio del Descuento (Opcional)", name: "fechaInicio", widget: "datetime", required: false }
      - { label: "Fin del Descuento (Opcional)", name: "fechaFin", widget: "datetime", required: false }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Imagen de Portada", name: "imagen", widget: "image" }
      - label: "Galería de Fotos Adicionales"
        name: "fotos"
        widget: "list"
        required: false
        field: { label: "Foto Adicional", name: "foto", widget: "image" }

  - name: "talleres"
    label: "Talleres Presenciales"
    folder: "contenido/talleres"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Nombre del Taller", name: "title", widget: "string" }
      - { label: "Fecha y Hora del Taller", name: "fecha", widget: "datetime" }
      - { label: "Lugar", name: "lugar", widget: "string", default: "Almax Center, Samborondón" }
      - { label: "Precio Normal ($)", name: "precio", widget: "number", value_type: "float" }
      - { label: "Descuento Pronto Pago (%) (Opcional)", name: "descuento", widget: "number", value_type: "int", default: 0, required: false }
      - { label: "Inicio Pronto Pago (Opcional)", name: "fechaInicio", widget: "datetime", required: false }
      - { label: "Fecha Límite Pronto Pago (Opcional)", name: "fechaFin", widget: "datetime", required: false }
      - { label: "Cupo Máximo", name: "cupoMax", widget: "number", value_type: "int", default: 10 }
      - { label: "Cupos Ocupados", name: "ocupados", widget: "number", value_type: "int", default: 0 }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Imagen", name: "imagen", widget: "image" }

  - name: "blog"
    label: "Blog y Técnicas"
    folder: "contenido/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Artículo", name: "title", widget: "string" }
      - { label: "Categoría del Blog", name: "categoria", widget: "select", options: ["Paso a Paso", "Patrones & Descargables", "Tips de Cuidado", "Detrás de Escenas"] }
      - { label: "Fecha", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Imagen de Portada", name: "imagen", widget: "image" }
      - { label: "Resumen Corto", name: "descripcion", widget: "text" }
      - { label: "Contenido Completo", name: "body", widget: "markdown" }
      - { label: "Archivo Descargable (PDF)", name: "archivo", widget: "file", required: false }
