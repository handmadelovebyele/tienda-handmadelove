<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handmade Love | EMOCION-ARTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-red: #D92314;
      --brand-red-hover: #b81b0e;
      --brand-red-light: #FFF0EE;
      --bg-cream: #FAF7F2;
      --sand-100: #F3ECE2;
      --sand-200: #E6DBCB;
      --text-dark: #2B2621;
      --text-muted: #6B6258;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-cream); color: var(--text-dark); line-height: 1.6; }

    /* Top banner */
    .top-banner { background: var(--brand-red); color: white; text-align: center; padding: 9px 16px; font-size: 0.82rem; font-weight: 600; }

    /* Navbar */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; background: white; border-bottom: 1px solid var(--sand-200); position: sticky; top: 0; z-index: 50; }
    .logo-container { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .logo-card img { height: 48px; border-radius: 8px; object-fit: contain; }
    .brand-main { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; display: block; }
    .brand-sub { font-size: 0.68rem; letter-spacing: 2px; color: var(--brand-red); font-weight: 700; text-transform: uppercase; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links button, .nav-links a { background: none; border: none; font-size: 0.95rem; font-weight: 600; color: var(--text-dark); cursor: pointer; text-decoration: none; transition: color 0.2s; }
    .nav-links button:hover, .nav-links a:hover { color: var(--brand-red); }
    .pill-talleres { background: var(--brand-red-light); color: var(--brand-red) !important; padding: 6px 14px; border-radius: 20px; }
    .cart-btn { background: var(--sand-100); border: 1px solid var(--sand-200); border-radius: 30px; padding: 8px 16px; cursor: pointer; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .cart-badge { background: var(--brand-red); color: white; border-radius: 50%; padding: 2px 7px; font-size: 0.75rem; }

    /* Hero */
    .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; max-width: 1200px; margin: 0 auto; padding: 60px 24px; }
    .hero-badge { color: var(--brand-red); font-weight: 700; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; line-height: 1.15; margin: 12px 0 18px; }
    .hero h1 span { font-style: italic; color: var(--brand-red); font-weight: 400; }
    .hero p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 28px; }
    .hero-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-primary { background: var(--brand-red); color: white; padding: 14px 28px; border-radius: 30px; text-decoration: none; font-weight: 600; }
    .btn-secondary { background: white; border: 1px solid var(--sand-200); color: var(--text-dark); padding: 14px 28px; border-radius: 30px; text-decoration: none; font-weight: 600; }
    .hero-img-box img { width: 100%; border-radius: 28px; height: 380px; object-fit: cover; }

    /* Catálogo */
    .catalogo-section { max-width: 1200px; margin: 0 auto; padding: 60px 24px 80px; }
    .section-title { text-align: center; margin-bottom: 35px; }
    .section-title h2 { font-family: 'Playfair Display', serif; font-size: 2.6rem; margin-bottom: 8px; }
    .section-title p { color: var(--text-muted); font-size: 1rem; }
    .filter-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 45px; }
    .filter-btn { background: var(--sand-100); color: #4A443A; border: 1px solid transparent; padding: 10px 22px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--brand-red); color: white; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
    
    /* Card interactiva */
    .card { background: white; border-radius: 22px; border: 1px solid var(--sand-200); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.08); }
    .card-img { position: relative; height: 240px; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.92); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; }
    .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
    .card-desc { color: var(--text-muted); font-size: 0.84rem; margin-bottom: 16px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--sand-100); }
    .card-price { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700; color: var(--brand-red); }
    .card-btn { background: var(--sand-100); border: 1px solid var(--sand-200); padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .card-btn:hover { background: var(--brand-red); color: white; border-color: var(--brand-red); }

    /* Modal / Pop-up con scroll y diseño flexible */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-card { 
      background: white; 
      border-radius: 24px; 
      max-width: 860px; 
      width: 100%; 
      max-height: 85vh; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 32px; 
      padding: 32px; 
      position: relative; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      overflow: hidden; /* Evita que el contenedor principal se deforme */
    }
    .modal-close { position: absolute; top: 16px; right: 18px; background: var(--sand-100); border: none; font-size: 1.4rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
    
    .modal-gallery { display: flex; flex-direction: column; gap: 12px; }
    .modal-main-img { width: 100%; height: 340px; object-fit: cover; border-radius: 16px; border: 1px solid var(--sand-200); }
    .modal-thumbnails { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .modal-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; transition: all 0.2s; flex-shrink: 0; }
    .modal-thumb.active, .modal-thumb:hover { border-color: var(--brand-red); opacity: 1; }
    
    /* Columna de información con Scrollbar independiente */
    .modal-info { 
      display: flex; 
      flex-direction: column; 
      max-height: calc(85vh - 64px); 
      overflow-y: auto; 
      padding-right: 10px; 
    }
    /* Estilo sutil de la barra de scroll */
    .modal-info::-webkit-scrollbar { width: 6px; }
    .modal-info::-webkit-scrollbar-thumb { background-color: var(--sand-200); border-radius: 4px; }
    .modal-info::-webkit-scrollbar-thumb:hover { background-color: #d1c3af; }

    .modal-cat { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-red); font-weight: 700; margin-bottom: 6px; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; line-height: 1.2; margin-bottom: 12px; }
    .modal-price { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--brand-red); font-weight: 700; margin-bottom: 16px; }
    .modal-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 24px; white-space: pre-line; }
    .modal-actions { margin-top: auto; padding-top: 10px; }
    .btn-modal-cart { background: var(--brand-red); color: white; border: none; padding: 14px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 1rem; width: 100%; transition: background 0.2s; }
    .btn-modal-cart:hover { background: var(--brand-red-hover); }

    /* Talleres */
    .workshops-section { background: #F4EFEB; border-top: 1px solid var(--sand-200); border-bottom: 1px solid var(--sand-200); padding: 80px 24px; }
    .workshops-container { max-width: 1200px; margin: 0 auto; }
    .workshops-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; margin-top: 40px; }

    /* Footer */
    .main-footer { background: #231F1C; color: #FAF7F2; padding: 70px 24px 30px; }
    .footer-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 40px; margin-bottom: 50px; }
    .footer-brand .logo-card img { height: 44px; margin-bottom: 12px; }
    .footer-brand .brand-main { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: white; }
    .footer-brand .brand-sub { color: var(--brand-red); font-size: 0.65rem; letter-spacing: 2px; }
    .footer-desc { color: #A89F94; font-size: 0.88rem; margin-top: 12px; line-height: 1.6; }
    .footer-col h4 { font-size: 0.78rem; letter-spacing: 2px; font-weight: 700; margin-bottom: 18px; color: #FAF7F2; }
    .footer-links { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-links a, .footer-links button { color: #A89F94; text-decoration: none; font-size: 0.88rem; background: none; border: none; cursor: pointer; text-align: left; padding: 0; }
    .footer-links a:hover, .footer-links button:hover { color: white; }
    .btn-wa-footer { display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white !important; padding: 10px 18px; border-radius: 30px; font-weight: 600; text-decoration: none; margin-top: 12px; font-size: 0.88rem; }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); text-align: center; padding-top: 24px; color: #7A7268; font-size: 0.82rem; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .modal-card { grid-template-columns: 1fr; padding: 24px; gap: 20px; overflow-y: auto; }
      .modal-info { max-height: none; padding-right: 0; }
      .modal-main-img { height: 260px; }
      .footer-container { grid-template-columns: 1fr; gap: 30px; }
    }
  </style>
</head>
<body>

  <!-- Top Banner -->
  <div class="top-banner">✨ Envíos a todo el país | Cupos limitados para talleres presenciales en Samborondón ✨</div>

  <!-- Navbar -->
  <header class="navbar">
    <a href="#" class="logo-container">
      <div class="logo-card"><img src="logo.jpg" alt="Logo" onerror="this.style.display='none'"></div>
      <div class="brand-text">
        <span class="brand-main">handmade love</span>
        <span class="brand-sub">BY E.L.E · EMOCION-ARTE</span>
      </div>
    </a>
    <nav class="nav-links">
      <button onclick="filtrar('todos')">Catálogo</button>
      <button onclick="filtrar('velas')">🕯️ Velas</button>
      <button onclick="filtrar('crochet')">
